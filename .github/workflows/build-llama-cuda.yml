name: build llama.cpp (CUDA sm_86, FX-8350)

# Watches ggml-org/llama.cpp for new releases and builds a binary tarball
# targeted at shockwave. Nothing here patches llama.cpp -- it builds upstream
# tags verbatim, only the build FLAGS are ours.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'upstream tag/commit to build (default: latest release)'
        required: false
      force:
        description: 'rebuild even if a release for that tag already exists'
        type: boolean
        default: false

concurrency:
  group: build-llama
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Inputs go through env, never interpolated straight into run:.
      - name: Decide what to build
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REF_INPUT: ${{ inputs.ref }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          set -euo pipefail
          REF="$REF_INPUT"
          if [ -z "$REF" ]; then
            REF=$(gh release view --repo ggml-org/llama.cpp --json tagName -q .tagName)
          fi
          case "$REF" in
            *[!A-Za-z0-9._/-]*) echo "refusing suspicious ref: $REF" >&2; exit 1 ;;
          esac
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_INPUT" != 'true' ] \
             && gh release view "$REF" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "  $REF already built -- skipping"
            echo "build=no" >> "$GITHUB_OUTPUT"
          else
            echo "  will build $REF"
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream
        if: steps.pick.outputs.build == 'yes'
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ steps.pick.outputs.ref }}
          fetch-depth: 1

      # Must stay on CUDA 12.x: shockwave links libcudart.so.12 / libcublas.so.12,
      # so a 13.x build would want .so.13 and fail to load there. The exact minor
      # need not match (12.6 -> 12.4 runtime is covered by CUDA minor version
      # compatibility); NVIDIA's ubuntu2404 repo has no 12.4 packages.
      #
      # Install cuda-toolkit-12-6, NOT the 'cuda' meta-package: the latter pulls
      # nvidia-dkms-*, which tries to build a kernel module against the runner's
      # azure kernel and fails. A build host needs the compiler, not a driver.
      - name: Install CUDA toolkit 12.6 (no driver)
        if: steps.pick.outputs.build == 'yes'
        run: |
          set -euo pipefail
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cuda-toolkit-12-6 ccache
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          echo "CUDACXX=/usr/local/cuda-12.6/bin/nvcc" >> "$GITHUB_ENV"
          /usr/local/cuda-12.6/bin/nvcc --version | tail -2

      - name: Cache ccache
        if: steps.pick.outputs.build == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ steps.pick.outputs.ref }}
          restore-keys: ccache-

      # CRITICAL: GGML_NATIVE must stay OFF. The runner is a modern Xeon/EPYC with
      # AVX2/AVX-512; shockwave is an AMD FX-8350 (Piledriver) with only avx, fma,
      # f16c. A -march=native build here would SIGILL there. These flags mirror
      # exactly what that CPU supports -- and it matters at runtime, not just at
      # startup, because qwen36-35b-a3b runs with --n-cpu-moe 8.
      - name: Configure
        if: steps.pick.outputs.build == 'yes'
        run: |
          set -euo pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DGGML_RPC=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX=ON -DGGML_FMA=ON -DGGML_F16C=ON \
            -DGGML_AVX2=OFF -DGGML_AVX512=OFF \
            -DGGML_BMI2=OFF -DGGML_AVX_VNNI=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache

      - name: Build
        if: steps.pick.outputs.build == 'yes'
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Stage install tree
        if: steps.pick.outputs.build == 'yes'
        id: pack
        env:
          REF: ${{ steps.pick.outputs.ref }}
        run: |
          set -euo pipefail
          cmake --install build --prefix "$PWD/staging/usr/local"
          NAME="llama-${REF}-linux-x64-cuda12.6-sm86-avx-fma-f16c.tar.gz"
          tar czf "$NAME" -C staging usr
          sha256sum "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      # Run the real binary on an emulated Piledriver. Grepping mnemonics does not
      # work: llama-server is a 17KB shim and the code lives in libggml-cpu.so, and
      # a hand-written opcode list will always miss something -- it missed BMI2
      # (shlx in ggml_cpu_init), which SIGILL'd on the box. Executing under
      # -cpu bdver2 catches anything the target CPU cannot run.
      - name: Verify against an emulated FX-8350 (bdver2)
        if: steps.pick.outputs.build == 'yes'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq qemu-user-static
          # QEMU calls Piledriver "Opteron_G5" -- it has AVX/FMA/F16C/BMI1 but
          # no BMI2 or AVX2, which is exactly the FX-8350's feature set.
          MODEL=Opteron_G5
          if ! qemu-x86_64-static -cpu help | grep -qw "$MODEL"; then
            echo "::error::qemu has no CPU model $MODEL; available:"
            qemu-x86_64-static -cpu help | head -30
            exit 1
          fi
          LD_LIBRARY_PATH="$PWD/staging/usr/local/lib" \
            qemu-x86_64-static -cpu "$MODEL" \
            staging/usr/local/bin/llama-server --version 2>&1 | tail -3
          echo "  ok: runs on an emulated $MODEL (Piledriver)"

      - name: Publish release
        if: steps.pick.outputs.build == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.pick.outputs.ref }}
          ASSET: ${{ steps.pack.outputs.name }}
        run: |
          set -euo pipefail
          gh release create "$REF" "$ASSET" "$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "llama.cpp $REF (CUDA sm_86, FX-8350)" \
            --notes "Upstream \`$REF\` built verbatim; only the build flags are ours.

          CUDA sm_86 / CUDA 12.6 (runs on the box's 12.4 runtime), \`GGML_NATIVE=OFF\` with AVX+FMA+F16C only
          (no AVX2/AVX-512 -- the target CPU is an AMD FX-8350).

          Install: \`scripts/install-shockwave.sh $REF\`"
